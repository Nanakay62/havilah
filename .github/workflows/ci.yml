name: Wellframe SaaS CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Syntax & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Syntax & Compilation Validation
        run: |
          cd server
          node -c server.js
          node -c middleware/auth.js
          node -c middleware/rateLimiter.js
          node -c scheduler/complianceScheduler.js
          node -c routes/learn.js
          node -c utils/crypto.js
          node -c utils/copsoq3Scoring.js
          node -c controllers/authController.js
          node -c controllers/hazardController.js
          node -c routes/auth.js
          node -c routes/billing.js
          node -c routes/sso.js
          node -c services/notificationService.js
          node -c utils/totp.js
          node -c middleware/validate.js

      - name: Secret Leak Prevention Check
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "❌ ERROR: Tracked .env file detected in repository!"
            exit 1
          else
            echo "✅ No .env files are tracked in git."
          fi

      - name: Run Test Suite
        working-directory: server
        env:
          JWT_SECRET: wellframe-test-jwt-secret-2026
          JWT_REFRESH_SECRET: wellframe-test-jwt-refresh-secret-2026
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPER_ADMIN_KEY: test-super-admin-key-2026
          HMAC_SECRET: test-hmac-secret-2026
          NODE_ENV: test
        run: npm test

