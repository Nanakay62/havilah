<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havilah - Activate Account</title>
  <link rel="preload" href="/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/tour.css">
  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card" id="activateCard">
    
    <!-- Progress Indicator -->
    <div class="auth-progress" id="progress-bar" aria-label="Activation progress">
      <div class="auth-progress-step is-active" id="prog-1"></div>
      <div class="auth-progress-step" id="prog-2"></div>
      <div class="auth-progress-step" id="prog-3"></div>
    </div>

    <!-- Error Banner -->
    <div id="error-banner" class="hidden alert-banner alert-danger" style="margin-bottom: var(--space-4);" role="alert">
      <span class="alert-icon" id="error-banner-icon" style="flex-shrink: 0;"></span>
      <div id="error-banner-text" style="flex: 1;"></div>
    </div>

    <!-- STEP 1 & 2: Verification -->
    <div id="step-verify" class="transition-all duration-300">
      <header class="auth-header">
        <div class="auth-brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <h1 class="auth-title">Activate your account</h1>
        <p class="auth-subtitle">Enter your corporate email and the activation code provided by your administrator.</p>
      </header>
      
      <form id="verify-form" novalidate>
        <div class="form-field">
          <label for="verify-email" class="form-label">Corporate email</label>
          <input type="email" id="verify-email" required class="input" placeholder="you@company.com" autocomplete="username">
        </div>

        <div class="form-field">
          <label for="verify-code" class="form-label">Activation code</label>
          <input type="text" id="verify-code" required class="input font-mono uppercase tracking-widest" placeholder="HR-XXXX-XXXX" autocomplete="off">
        </div>

        <button type="submit" id="btn-verify" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
          <span>Verify Code</span>
        </button>
      </form>
    </div>

    <!-- STEP 3: Setup Password -->
    <div id="step-setup" class="hidden transition-all duration-300">
      <header class="auth-header">
        <div class="auth-brand-mark" style="background-color: var(--success-bg); color: var(--success); border-color: rgba(21, 128, 61, 0.2);" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2 class="auth-title">Welcome to <span id="display-company" style="color: var(--brand);">Your Company</span></h2>
        <p class="auth-subtitle">Code validated. Complete your password setup to continue.</p>
      </header>
      
      <form id="setup-form" novalidate>
        <div class="form-field">
          <label for="setup-name" class="form-label">Full name</label>
          <input type="text" id="setup-name" required class="input" placeholder="Jane Doe" autocomplete="name">
        </div>

        <div class="form-field">
          <label for="setup-password" class="form-label">Set password</label>
          <div class="input-with-button">
            <input type="password" id="setup-password" required minlength="8" class="input" placeholder="••••••••" autocomplete="new-password">
            <button type="button" id="toggleSetupPasswordBtn" class="input-action-btn" title="Toggle password visibility" aria-label="Toggle password visibility"></button>
          </div>
        </div>

        <div class="form-field">
          <label for="setup-confirm" class="form-label">Confirm password</label>
          <div class="input-with-button">
            <input type="password" id="setup-confirm" required minlength="8" class="input" placeholder="••••••••" autocomplete="new-password">
            <button type="button" id="toggleSetupConfirmBtn" class="input-action-btn" title="Toggle password visibility" aria-label="Toggle password visibility"></button>
          </div>
          <p id="pwd-error" class="form-error hidden" style="margin-top: 4px;">Passwords do not match.</p>
        </div>
        
        <div class="form-field">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="accept-terms" required>
            <span>I agree to the <a href="/terms" target="_blank">Privacy Terms</a> and understand that my wellness data remains strictly confidential and anonymous to my employer.</span>
          </label>
        </div>

        <button type="submit" id="btn-activate" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
          <span>Activate Account</span>
        </button>
      </form>
    </div>

    <!-- Footer link -->
    <footer id="footer-links" class="auth-footer">
      Already activated? <a href="/login.html">Log in</a>
    </footer>
  </main>

  <script>
    const stepVerify = document.getElementById('step-verify');
    const stepSetup = document.getElementById('step-setup');
    const verifyForm = document.getElementById('verify-form');
    const setupForm = document.getElementById('setup-form');
    const btnVerify = document.getElementById('btn-verify');
    const btnActivate = document.getElementById('btn-activate');
    const footerLinks = document.getElementById('footer-links');
    
    let validatedEmail = '';
    let validatedCode = '';

    function initPasswordToggle(inputId, btnId) {
      const pass = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (btn && pass) {
        btn.innerHTML = HavilahIcons.eye(18);
        btn.addEventListener('click', () => {
          if (pass.type === 'password') {
            pass.type = 'text';
            btn.innerHTML = HavilahIcons.eyeOff(18);
            btn.setAttribute('aria-label', 'Hide password');
          } else {
            pass.type = 'password';
            btn.innerHTML = HavilahIcons.eye(18);
            btn.setAttribute('aria-label', 'Show password');
          }
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPasswordToggle('setup-password', 'toggleSetupPasswordBtn');
      initPasswordToggle('setup-confirm', 'toggleSetupConfirmBtn');
      const errIcon = document.getElementById('error-banner-icon');
      if (errIcon && window.HavilahIcons) {
        errIcon.innerHTML = HavilahIcons.alertCircle(18);
      }
    });

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      const text = document.getElementById('error-banner-text');
      if (banner && text) {
        text.innerHTML = msg;
        banner.classList.remove('hidden');
      } else {
        alert(msg);
      }
    }

    function hideError() {
      const banner = document.getElementById('error-banner');
      if (banner) banner.classList.add('hidden');
    }

    // Clear error banner when typing
    ['verify-email', 'verify-code', 'setup-name', 'setup-password', 'setup-confirm'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', hideError);
    });

    // Auto-parse code from URL query params (1-click Magic Link)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const codeFromUrl = urlParams.get('code') || urlParams.get('invite');
      if (codeFromUrl) {
        const codeInput = document.getElementById('verify-code');
        if (codeInput) {
          codeInput.value = codeFromUrl.trim().toUpperCase();
        }
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email = document.getElementById('verify-email').value.trim();
      const code = document.getElementById('verify-code').value.trim().toUpperCase();

      if (!email || !code) {
        showError('Please enter both your corporate email and activation code.');
        return;
      }

      btnVerify.disabled = true;
      btnVerify.classList.add('is-loading');
      btnVerify.innerHTML = '<svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

      try {
        const res = await fetch('/api/v1/auth/verify-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const data = await res.json().catch(() => ({}));
        
        if (res.ok && data.success) {
          // Success: Transition to Step 3
          validatedEmail = email;
          validatedCode = code;
          const companyText = data.companyName || 'Your Company';
          const deptText = data.departmentName ? ` - ${data.departmentName}` : '';
          document.getElementById('display-company').innerText = companyText + deptText;
          
          document.getElementById('prog-2').classList.add('is-active');
          document.getElementById('prog-3').classList.add('is-active');

          stepVerify.style.opacity = '0';
          stepVerify.style.transform = 'translateX(-16px)';
          footerLinks.style.display = 'none';

          setTimeout(() => {
            stepVerify.classList.add('hidden');
            stepSetup.classList.remove('hidden');
            stepSetup.style.opacity = '0';
            stepSetup.style.transform = 'translateX(16px)';
            void stepSetup.offsetWidth;
            stepSetup.style.opacity = '1';
            stepSetup.style.transform = 'translateX(0)';
            setTimeout(() => document.getElementById('setup-name').focus(), 100);
          }, 300);

        } else {
          const errMsg = data.message || data.error || (res.status === 429 ? 'Too many attempts. Please try again in a few minutes.' : 'Invalid activation code.');
          showError(errMsg);
        }
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        btnVerify.disabled = false;
        btnVerify.classList.remove('is-loading');
        btnVerify.innerHTML = '<span>Verify Code</span>';
      }
    });

    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const name = document.getElementById('setup-name').value.trim();
      const pwd = document.getElementById('setup-password').value;
      const conf = document.getElementById('setup-confirm').value;
      const pwdError = document.getElementById('pwd-error');

      if (!name) {
        showError('Please enter your full name.');
        return;
      }

      if (pwd !== conf) {
        pwdError.classList.remove('hidden');
        return;
      }
      pwdError.classList.add('hidden');

      btnActivate.disabled = true;
      btnActivate.classList.add('is-loading');
      btnActivate.innerHTML = '<svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

      try {
        const res = await fetch('/api/v1/auth/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: validatedEmail, code: validatedCode, fullName: name, password: pwd })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          window.location.href = '/login.html?activated=true';
        } else {
          if (data.error === 'EMAIL_ALREADY_EXISTS' || (data.error && data.error.includes('already registered')) || (data.message && data.message.includes('already exists'))) {
            showError('An account with this email address already exists. <a href="/login.html">Log in here</a>');
          } else if (res.status === 429) {
            showError(data.message || 'Too many attempts. Please try again in a few minutes.');
          } else {
            showError(data.message || data.error || 'Activation failed. Please try again.');
          }
        }
      } catch (err) {
        showError('Network error during activation.');
      } finally {
        btnActivate.disabled = false;
        btnActivate.classList.remove('is-loading');
        btnActivate.innerHTML = '<span>Activate Account</span>';
      }
    });
  </script>
  <script src="/js/tour.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      HavilahTour.init({
        tourId: 'activate-page',
        welcomeTitle: 'Account Activation',
        welcomeDesc: 'Welcome! Follow these simple steps to activate your corporate account.',
        autoStart: false,
        steps: [
          {
            target: '#progress-bar',
            title: 'Activation Progress',
            description: 'Tracks your onboarding steps: validation of your corporate credentials and setting up your secure password.',
            placement: 'bottom'
          },
          {
            target: '#verify-email',
            title: 'Corporate Email',
            description: 'Provide your assigned work email address registered with your company.',
            placement: 'bottom'
          },
          {
            target: '#verify-code',
            title: 'Activation Code',
            description: 'Enter the unique activation code (HR-XXXX-XXXX) provided in your HR invitation letter or email.',
            placement: 'bottom'
          },
          {
            target: '#btn-verify',
            title: 'Validate & Proceed',
            description: 'Click to verify your organization credentials and advance to secure password setup.',
            placement: 'top'
          }
        ]
      });
    });
  </script>
</body>
</html>
