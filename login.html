<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havilah - Sign In to Your Workplace Wellbeing Portal</title>
  <meta name="description" content="Sign in to Havilah to access confidential employee wellbeing check-ins, anonymous HR analytics dashboards, or clinical assessor workflows.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0F766E">
  <link rel="canonical" href="https://havilah.dic20016.workers.dev/login">
  <link rel="icon" type="image/svg+xml" href="/assets/havilah-mark.svg">
  <link rel="apple-touch-icon" href="/assets/havilah-mark.svg">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:site_name" content="Havilah">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://havilah.dic20016.workers.dev/login">
  <meta property="og:title" content="Sign In - Havilah Workplace Wellbeing">
  <meta property="og:description" content="Sign in to your Havilah employee wellbeing or HR psychosocial analytics workspace.">
  <meta property="og:image" content="https://havilah.dic20016.workers.dev/assets/hero-hr-analytics.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign In - Havilah Workplace Wellbeing">
  <meta name="twitter:description" content="Sign in to your Havilah employee wellbeing or HR psychosocial analytics workspace.">
  <meta name="twitter:image" content="https://havilah.dic20016.workers.dev/assets/hero-hr-analytics.png">
  <link rel="preload" href="/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/tour.css">
  <link rel="stylesheet" href="/css/loader.css">
  <script src="/js/icons.js"></script>
  <script src="/js/havilahLoader.js"></script>
  <script src="/js/auth.js?v=3"></script>
</head>
<body class="auth-page">
  <main class="auth-card" id="loginCard">
    <header class="auth-header">
      <img src="/assets/havilah-logo.svg" alt="Havilah" style="height: 36px; width: auto; display: block; margin: 0 auto 16px;">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Sign in to your Individual or Company wellbeing workspace.</p>
    </header>

    <div id="statusBox" class="hidden alert-banner alert-success" style="margin-bottom: var(--space-4);" role="status"></div>
    <div id="errorBox" class="hidden alert-banner alert-danger" style="margin-bottom: var(--space-4);" role="alert"></div>

    <form id="loginForm" novalidate>
      <div id="credentialsFields">
      <div class="form-field">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" required class="input" placeholder="you@example.com" autocomplete="username">
      </div>

      <div class="form-field">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="/reset-password.html" style="font-size: var(--text-xs); color: var(--brand); font-weight: var(--weight-medium); text-decoration: none;">Forgot password?</a>
        </div>
        <div class="input-with-button">
          <input type="password" id="password" required class="input" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="togglePasswordBtn" class="input-action-btn" title="Toggle password visibility" aria-label="Toggle password visibility"></button>
        </div>
      </div>
      </div>

      <div id="twoFactorStepBox" class="hidden" style="margin-bottom: var(--space-4);">
        <div style="padding: 12px; border-radius: 10px; background: rgba(0, 183, 195, 0.08); border: 1px solid rgba(0, 183, 195, 0.25); margin-bottom: 12px; font-size: var(--text-xs); color: var(--text-2);">
          Enter the 6-digit code from your authenticator app, or enter an unused single-use backup recovery code (e.g. <code>A1B2-C3D4</code>).
        </div>
        <div class="form-field">
          <label for="totpCodeInput" class="form-label">Two-Factor or Recovery Code</label>
          <input type="text" id="totpCodeInput" class="input" placeholder="123456 or A1B2-C3D4" autocomplete="one-time-code" style="letter-spacing: 0.1em; font-weight: 600;">
        </div>
        <button type="button" id="backToCredentialsBtn" class="btn btn-ghost btn-sm" style="padding: 0; font-size: var(--text-xs); color: var(--text-muted); margin-top: 4px; background: none; border: none; cursor: pointer;">
          &larr; Use a different account
        </button>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
        <span>Sign In</span>
      </button>
    </form>

    <footer class="auth-footer">
      New here? <a href="/register?mode=individual">Individual 30-day trial</a> &middot; <a href="/activate.html">Activate invite</a> &middot; <a href="/consult">Guest doctor (GHS 349)</a>
    </footer>
  </main>

  <script>
    // Eye icon initialization and toggle
    document.addEventListener('DOMContentLoaded', () => {
      const pass = document.getElementById('password');
      const btn = document.getElementById('togglePasswordBtn');
      const statusBox = document.getElementById('statusBox');

      // Check for ?registered=true or ?activated=true
      const urlParams = new URLSearchParams(window.location.search);
      if ((urlParams.get('registered') === 'true' || urlParams.get('activated') === 'true') && statusBox) {
        statusBox.textContent = 'Account activated successfully. Please sign in with your password.';
        statusBox.classList.remove('hidden');
      }
      if (urlParams.get('reset') === 'true' && statusBox) {
        statusBox.textContent = 'Your password has been reset. Please sign in with your new password.';
        statusBox.classList.remove('hidden');
      }

      if (btn && pass) {
        btn.innerHTML = HavilahIcons.eye(18);
        btn.addEventListener('click', () => {
          if (pass.type === 'password') {
            pass.type = 'text';
            btn.innerHTML = HavilahIcons.eyeOff(18);
            btn.setAttribute('aria-label', 'Hide password');
          } else {
            pass.type = 'password';
            btn.innerHTML = HavilahIcons.eye(18);
            btn.setAttribute('aria-label', 'Show password');
          }
        });
      }
    });

    let pending2faTempToken = null;
    let pending2faEmail = '';

    const backToCredsBtn = document.getElementById('backToCredentialsBtn');
    if (backToCredsBtn) {
      backToCredsBtn.addEventListener('click', () => {
        pending2faTempToken = null;
        document.getElementById('twoFactorStepBox').classList.add('hidden');
        document.getElementById('credentialsFields').classList.remove('hidden');
        document.getElementById('totpCodeInput').value = '';
        document.getElementById('submitBtn').innerHTML = '<span>Sign In</span>';
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const totpCode = document.getElementById('totpCodeInput') ? document.getElementById('totpCodeInput').value.trim() : '';
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const statusBox = document.getElementById('statusBox');
      
      if (statusBox) statusBox.classList.add('hidden');
      errorBox.classList.add('hidden');

      if (pending2faTempToken) {
        if (!totpCode) {
          errorBox.textContent = 'Please enter your 6-digit authenticator code or recovery code.';
          errorBox.classList.remove('hidden');
          return;
        }
      } else if (!email || !password) {
        errorBox.textContent = 'Please enter both your corporate email and password.';
        errorBox.classList.remove('hidden');
        return;
      }

      HavilahLoader.setButtonLoading(btn, true, pending2faTempToken ? 'Verifying...' : 'Signing in...');
      
      try {
        if (pending2faTempToken) {
          await Auth.verify2fa(pending2faTempToken, totpCode, pending2faEmail);
        } else {
          const loginResp = await Auth.login(email, password);
          if (loginResp && loginResp.requires_2fa && loginResp.temp_token) {
            pending2faTempToken = loginResp.temp_token;
            pending2faEmail = email;
            document.getElementById('credentialsFields').classList.add('hidden');
            document.getElementById('twoFactorStepBox').classList.remove('hidden');
            document.getElementById('totpCodeInput').focus();
            HavilahLoader.setButtonLoading(btn, false, '<span>Verify &amp; Sign In</span>');
            return;
          }
        }
        const tokenData = Auth.parseToken();
        
        if (!tokenData) throw new Error('Invalid token received');
        
        if (tokenData.isSystemSuperAdmin || tokenData.role === 'super_admin') {
          HavilahLoader.showFullscreen({
            label: 'Preparing your workspace',
            sublabel: 'Opening Super Admin Console...'
          });
          window.location.href = '/app/superadmin.html';
        } else if (tokenData.role === 'hr_admin' || tokenData.role === 'tenant_admin') {
          HavilahLoader.showFullscreen({
            label: 'Preparing your workspace',
            sublabel: 'Verifying N >= 5 privacy threshold...'
          });
          window.location.href = '/portal/hr.html';
        } else if (tokenData.role === 'employee' || tokenData.role === 'individual') {
          HavilahLoader.showFullscreen({
            label: 'Preparing your workspace',
            sublabel: tokenData.role === 'individual' ? 'Opening personal wellbeing workspace...' : 'Opening confidential wellbeing workspace...'
          });
          window.location.href = '/app/dashboard.html';
        } else {
          throw new Error('Unknown role assignment');
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Authentication failed. Please verify your credentials.';
        errorBox.classList.remove('hidden');
        HavilahLoader.setButtonLoading(btn, false, pending2faTempToken ? '<span>Verify &amp; Sign In</span>' : '<span>Sign In</span>');
      }
    });
  </script>
  <script src="/js/tour.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      HavilahTour.init({
        tourId: 'login-page',
        welcomeTitle: 'Havilah Login',
        welcomeDesc: 'Here\'s how to securely access your wellbeing platform.',
        autoStart: false,
        steps: [
          {
            target: '#loginForm',
            title: 'Secure Sign-In',
            description: 'Enter your corporate email and password to access your personalized dashboard. All connections are encrypted end-to-end.',
            placement: 'top'
          },
          {
            target: '#email',
            title: 'Corporate Email',
            description: 'Use the email address provided by your organization during onboarding. This links you to your company\'s wellness workspace.',
            placement: 'bottom'
          },
          {
            target: '#password',
            title: 'Secure Password',
            description: 'Your password is hashed and never stored in plain text. Use the eye icon to toggle visibility.',
            placement: 'bottom'
          },
          {
            target: '#submitBtn',
            title: 'Sign In',
            description: 'Click to authenticate. You\'ll be routed to your Employee Dashboard or HR Analytics Portal based on your role.',
            placement: 'top'
          }
        ]
      });
    });
  </script>
</body>
</html>
