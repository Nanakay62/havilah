<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havilah - Login</title>
  <link rel="preload" href="/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/tour.css">
  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card" id="loginCard">
    <header class="auth-header">
      <div class="auth-brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h1 class="auth-title">Sign in to Havilah</h1>
      <p class="auth-subtitle">Enter your corporate credentials to access your workspace.</p>
    </header>

    <div id="statusBox" class="hidden alert-banner alert-success" style="margin-bottom: var(--space-4);" role="status"></div>
    <div id="errorBox" class="hidden alert-banner alert-danger" style="margin-bottom: var(--space-4);" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-field">
        <label for="email" class="form-label">Corporate email</label>
        <input type="email" id="email" required class="input" placeholder="you@company.com" autocomplete="username">
      </div>

      <div class="form-field">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="/reset-password.html" style="font-size: var(--text-xs); color: var(--brand); font-weight: var(--weight-medium); text-decoration: none;">Forgot password?</a>
        </div>
        <div class="input-with-button">
          <input type="password" id="password" required class="input" placeholder="••••••••" autocomplete="current-password">
          <button type="button" id="togglePasswordBtn" class="input-action-btn" title="Toggle password visibility" aria-label="Toggle password visibility"></button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);">
        <span>Sign In</span>
      </button>
    </form>

    <footer class="auth-footer">
      Have an invite code? <a href="/activate.html">Activate account</a>
    </footer>
  </main>

  <script>
    // Eye icon initialization and toggle
    document.addEventListener('DOMContentLoaded', () => {
      const pass = document.getElementById('password');
      const btn = document.getElementById('togglePasswordBtn');
      const statusBox = document.getElementById('statusBox');

      // Check for ?registered=true or ?activated=true
      const urlParams = new URLSearchParams(window.location.search);
      if ((urlParams.get('registered') === 'true' || urlParams.get('activated') === 'true') && statusBox) {
        statusBox.textContent = 'Account activated successfully. Please sign in with your password.';
        statusBox.classList.remove('hidden');
      }
      if (urlParams.get('reset') === 'true' && statusBox) {
        statusBox.textContent = 'Your password has been reset. Please sign in with your new password.';
        statusBox.classList.remove('hidden');
      }

      if (btn && pass) {
        btn.innerHTML = HavilahIcons.eye(18);
        btn.addEventListener('click', () => {
          if (pass.type === 'password') {
            pass.type = 'text';
            btn.innerHTML = HavilahIcons.eyeOff(18);
            btn.setAttribute('aria-label', 'Hide password');
          } else {
            pass.type = 'password';
            btn.innerHTML = HavilahIcons.eye(18);
            btn.setAttribute('aria-label', 'Show password');
          }
        });
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const statusBox = document.getElementById('statusBox');
      
      if (statusBox) statusBox.classList.add('hidden');
      errorBox.classList.add('hidden');

      if (!email || !password) {
        errorBox.textContent = 'Please enter both your corporate email and password.';
        errorBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.innerHTML = '<svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
      
      try {
        await Auth.login(email, password);
        const tokenData = Auth.parseToken();
        
        if (!tokenData) throw new Error('Invalid token received');
        
        if (tokenData.isSystemSuperAdmin || tokenData.role === 'super_admin') {
          window.location.href = '/app/superadmin.html';
        } else if (tokenData.role === 'hr_admin' || tokenData.role === 'tenant_admin') {
          window.location.href = '/portal/hr.html';
        } else if (tokenData.role === 'employee') {
          window.location.href = '/app/dashboard.html';
        } else {
          throw new Error('Unknown role assignment');
        }
      } catch (err) {
        errorBox.textContent = err.message || 'Authentication failed. Please verify your credentials.';
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.classList.remove('is-loading');
        btn.innerHTML = '<span>Sign In</span>';
      }
    });
  </script>
  <script src="/js/tour.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      HavilahTour.init({
        tourId: 'login-page',
        welcomeTitle: 'Havilah Login',
        welcomeDesc: 'Here\'s how to securely access your wellbeing platform.',
        autoStart: false,
        steps: [
          {
            target: '#loginForm',
            title: 'Secure Sign-In',
            description: 'Enter your corporate email and password to access your personalized dashboard. All connections are encrypted end-to-end.',
            placement: 'top'
          },
          {
            target: '#email',
            title: 'Corporate Email',
            description: 'Use the email address provided by your organization during onboarding. This links you to your company\'s wellness workspace.',
            placement: 'bottom'
          },
          {
            target: '#password',
            title: 'Secure Password',
            description: 'Your password is hashed and never stored in plain text. Use the eye icon to toggle visibility.',
            placement: 'bottom'
          },
          {
            target: '#submitBtn',
            title: 'Sign In',
            description: 'Click to authenticate. You\'ll be routed to your Employee Dashboard or HR Analytics Portal based on your role.',
            placement: 'top'
          }
        ]
      });
    });
  </script>
</body>
</html>
