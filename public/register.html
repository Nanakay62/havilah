<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havilah — Account Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden">
    
    <!-- Progress Indicator -->
    <div class="flex gap-2 mb-6" id="progress-bar">
      <div class="h-1 flex-1 bg-cyan-500 rounded-full transition-all duration-300" id="prog-1"></div>
      <div class="h-1 flex-1 bg-white/10 rounded-full transition-all duration-300" id="prog-2"></div>
      <div class="h-1 flex-1 bg-white/10 rounded-full transition-all duration-300" id="prog-3"></div>
    </div>

    <!-- STEP 1 & 2: Verification -->
    <div id="step-verify" class="transition-all duration-500 transform translate-x-0 opacity-100">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold mb-2">Join Your Team</h2>
        <p class="text-slate-400 text-sm">Enter your corporate email and activation code provided by HR.</p>
      </div>
      
      <form id="verify-form" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Corporate Email</label>
          <input type="email" id="verify-email" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 transition-colors" placeholder="you@company.com">
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Activation Code</label>
          <input type="text" id="verify-code" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 transition-colors uppercase tracking-widest font-mono" placeholder="WF-XXX-XXXX">
        </div>

        <!-- Locked Department Indicator (Shown when parsed from invite) -->
        <div id="dept-lock-container" class="hidden bg-cyan-950/40 border border-cyan-500/30 p-3 rounded-lg flex items-center justify-between">
          <div>
            <div class="text-[10px] uppercase font-bold text-cyan-400">Target Department (Locked)</div>
            <div id="locked-dept-name" class="text-sm font-semibold text-white">Engineering</div>
          </div>
          <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>

        <button type="submit" id="btn-verify" class="w-full bg-cyan-600 hover:bg-cyan-500 transition duration-200 py-2.5 rounded-lg font-semibold mt-4 shadow-lg shadow-cyan-600/20 flex justify-center items-center">
          <span>Verify Code</span>
        </button>
      </form>
    </div>

    <!-- STEP 3: Setup Password -->
    <div id="step-setup" class="hidden transition-all duration-500 transform translate-x-8 opacity-0 absolute top-8 left-8 right-8">
      <div class="flex items-center justify-center w-12 h-12 bg-green-500/20 text-green-400 rounded-full mx-auto mb-4 border border-green-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
      </div>
      <h2 class="text-2xl font-bold text-center mb-1">Welcome to <span id="display-company" class="text-cyan-400">Your Company</span></h2>
      <p class="text-slate-400 text-center text-sm mb-6">Code validated. Complete registration to continue.</p>
      
      <form id="setup-form" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Full Name</label>
          <input type="text" id="setup-name" required class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500" placeholder="Jane Doe">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Assigned Department</label>
          <input type="text" id="setup-dept" readonly class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-sm text-slate-300 cursor-not-allowed font-medium" value="General">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Set Password</label>
          <div class="relative">
            <input type="password" id="setup-password" required minlength="8" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:border-cyan-500" placeholder="••••••••">
            <button type="button" onclick="const p = document.getElementById('setup-password'); if(p.type==='password'){p.type='text';this.textContent='🙈';}else{p.type='password';this.textContent='👁️';}" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-base focus:outline-none" title="Toggle Password Visibility">👁️</button>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Confirm Password</label>
          <div class="relative">
            <input type="password" id="setup-confirm" required minlength="8" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:border-cyan-500" placeholder="••••••••">
            <button type="button" onclick="const p = document.getElementById('setup-confirm'); if(p.type==='password'){p.type='text';this.textContent='🙈';}else{p.type='password';this.textContent='👁️';}" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-base focus:outline-none" title="Toggle Password Visibility">👁️</button>
          </div>
          <p id="pwd-error" class="text-red-400 text-xs mt-1 hidden">Passwords do not match.</p>
        </div>
        
        <div class="pt-2 pb-2">
          <label class="flex items-start gap-3 cursor-pointer group">
            <div class="relative flex items-center pt-0.5">
              <input type="checkbox" id="accept-terms" required class="peer appearance-none w-4 h-4 border border-white/20 rounded bg-white/5 checked:bg-cyan-500 checked:border-cyan-500 transition-colors">
              <svg class="absolute w-3 h-3 left-0.5 pointer-events-none opacity-0 peer-checked:opacity-100 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <span class="text-xs text-slate-400 leading-tight group-hover:text-slate-300 transition-colors">I agree to the <a href="#" class="text-cyan-400 hover:underline">Privacy Terms</a> and understand that my wellness data remains strictly confidential and anonymous ($N \ge 5$).</span>
          </label>
        </div>

        <button type="submit" id="btn-activate" class="w-full bg-cyan-600 hover:bg-cyan-500 transition duration-200 py-2.5 rounded-lg font-semibold mt-4 shadow-lg shadow-cyan-600/20 flex justify-center items-center">
          <span>Complete Registration</span>
        </button>
      </form>
    </div>

    <!-- Footer link -->
    <div id="footer-links" class="text-center text-xs text-slate-500 mt-6 pt-4 border-t border-white/10">
      Already registered? <a href="/login.html" class="text-cyan-400 hover:underline">Log in</a>
    </div>
  </div>

  <script>
    const stepVerify = document.getElementById('step-verify');
    const stepSetup = document.getElementById('step-setup');
    const verifyForm = document.getElementById('verify-form');
    const setupForm = document.getElementById('setup-form');
    const btnVerify = document.getElementById('btn-verify');
    const btnActivate = document.getElementById('btn-activate');
    const footerLinks = document.getElementById('footer-links');
    
    let validatedEmail = '';
    let validatedCode = '';
    let assignedDepartment = 'General';

    // Auto-parse code from URL query params (Magic Link reading ?invite=WF-XXXXXX)
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const codeFromUrl = urlParams.get('invite') || urlParams.get('code');
      if (codeFromUrl) {
        const codeInput = document.getElementById('verify-code');
        if (codeInput) {
          const cleanCode = codeFromUrl.trim().toUpperCase();
          codeInput.value = cleanCode;

          // Attempt auto verification of invite code to resolve and lock department
          try {
            const res = await fetch('/api/v1/auth/verify-invite', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ code: cleanCode })
            });
            const data = await res.json();
            if (res.ok && data.success) {
              assignedDepartment = data.departmentName || 'General';
              document.getElementById('locked-dept-name').innerText = assignedDepartment;
              document.getElementById('dept-lock-container').classList.remove('hidden');
              document.getElementById('setup-dept').value = assignedDepartment;
            }
          } catch (e) {
            console.error('Magic link parse auto-verify failed', e);
          }
        }
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('verify-email').value.trim();
      const code = document.getElementById('verify-code').value.trim().toUpperCase();

      btnVerify.disabled = true;
      btnVerify.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

      try {
        const res = await fetch('/api/v1/auth/verify-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
          validatedEmail = email;
          validatedCode = code;
          const companyText = data.companyName || 'Your Company';
          const deptText = data.departmentName || 'General';
          assignedDepartment = deptText;

          document.getElementById('display-company').innerText = companyText;
          document.getElementById('setup-dept').value = deptText;
          
          document.getElementById('prog-2').classList.replace('bg-white/10', 'bg-cyan-500');
          document.getElementById('prog-3').classList.replace('bg-white/10', 'bg-cyan-500');

          stepVerify.classList.replace('opacity-100', 'opacity-0');
          stepVerify.classList.replace('translate-x-0', '-translate-x-8');
          footerLinks.style.display = 'none';

          setTimeout(() => {
            stepVerify.classList.add('hidden');
            stepSetup.classList.remove('hidden');
            void stepSetup.offsetWidth;
            stepSetup.classList.replace('opacity-0', 'opacity-100');
            stepSetup.classList.replace('translate-x-8', 'translate-x-0');
            stepSetup.classList.remove('absolute', 'top-8', 'left-8', 'right-8');
            setTimeout(() => document.getElementById('setup-name').focus(), 100);
          }, 500);

        } else {
          showError(data.error || 'Invalid or revoked activation code.');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      } finally {
        btnVerify.disabled = false;
        btnVerify.innerHTML = '<span>Verify Code</span>';
      }
    });

    setupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('setup-name').value.trim();
      const pwd = document.getElementById('setup-password').value;
      const conf = document.getElementById('setup-confirm').value;
      const pwdError = document.getElementById('pwd-error');

      if (pwd !== conf) {
        pwdError.classList.remove('hidden');
        return;
      }
      pwdError.classList.add('hidden');

      btnActivate.disabled = true;
      btnActivate.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

      try {
        const res = await fetch('/api/v1/auth/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: validatedEmail, code: validatedCode, fullName: name, password: pwd })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/login.html?registered=true';
        } else {
          showError(data.error || 'Registration failed.');
        }
      } catch (err) {
        showError('Network error during registration.');
      } finally {
        btnActivate.disabled = false;
        btnActivate.innerHTML = '<span>Complete Registration</span>';
      }
    });
  </script>
</body>
</html>
